name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # omnibioai-iam-client is a private repo pinned by git URL in
      # pyproject.toml. IAM_CLIENT_READ_TOKEN is the same read-only token the
      # publish workflow (ci.yml) uses for that dependency.
      - name: Install dependencies
        env:
          IAM_CLIENT_READ_TOKEN: ${{ secrets.IAM_CLIENT_READ_TOKEN }}
        run: |
          if [ -z "$IAM_CLIENT_READ_TOKEN" ]; then
            echo "::error::Repository secret IAM_CLIENT_READ_TOKEN is not set; it must grant read access to omnibioai-iam-client."
            exit 1
          fi
          git config --global \
            "url.https://x-access-token:${IAM_CLIENT_READ_TOKEN}@github.com/OmniBioAI/omnibioai-iam-client.git.insteadOf" \
            "https://github.com/OmniBioAI/omnibioai-iam-client.git"
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
