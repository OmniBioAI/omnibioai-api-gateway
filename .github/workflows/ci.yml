name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  docker:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    # Only publishes for a real version tag or an explicit manual run --
    # never for an ordinary push to main. Matches omnibioai-security-audit's
    # own tag-gated convention; workflow_dispatch is additionally allowed
    # here so this can be validated once before the first real tag push,
    # the same way that repo's own pipeline was validated with -ci-test
    # tags before trusting it for a real release.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # QEMU registers binfmt_misc handlers so the amd64 GitHub-hosted
      # runner can emulate arm64 instructions -- required for Buildx to
      # actually execute the arm64 half of the multi-platform build below
      # (setup-buildx-action alone only gives you a BuildKit builder, not
      # the ability to run non-native-arch layers).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build context is this repo alone (`.`) -- see the Dockerfile's own
      # comment for why the previous parent-directory/sibling-COPY
      # requirement no longer applies. IAM_CLIENT_READ_TOKEN must be a
      # fine-grained PAT scoped to Contents:Read on omnibioai-iam-client
      # only; it is NOT created or assumed present by this workflow. If
      # the secret is missing, this step fails at the private-dependency
      # install inside the Dockerfile's RUN --mount=type=secret layer --
      # a configuration gap to fix by adding the repo secret, not by
      # working around it here.
      #
      # platforms: linux/amd64,linux/arm64 -- makes build-push-action emit
      # a single multi-arch manifest list under each tag from
      # steps.meta.outputs.tags (not two separate single-arch images), so
      # `docker pull`/`docker run` on either architecture resolves the
      # same tag to the right native image. All of this Dockerfile's
      # dependencies (fastapi/uvicorn/httpx/redis/pyjwt, plus the pinned
      # omnibioai-iam-client git dependency's own httpx/redis/python-jose/
      # pydantic) are pure-Python or ship manylinux aarch64 wheels
      # (pydantic-core, cryptography), and python:3.11-slim itself
      # publishes an arm64 variant -- so no cross-compilation toolchain is
      # needed for the emulated arm64 leg.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            github_token=${{ secrets.IAM_CLIENT_READ_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
